<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Portal - Enterprise Vendor Accounting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
  <div class="max-w-5xl mx-auto py-10 px-4">
    <!-- Header -->
    <header class="flex items-center justify-between pb-6 border-b border-slate-200">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block p-2 bg-indigo-600 text-white rounded-lg font-bold text-lg">IP</span>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900" id="portal-title">Invoice Portal</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">Simulated Vendor Invoicing System</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
          Environment: Sandbox
        </span>
        <span class="text-xs text-slate-400" id="portal-timestamp"></span>
      </div>
    </header>

    <!-- Search Section -->
    <section class="mt-8 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex flex-col sm:flex-row gap-4 items-end">
        <div class="flex-1">
          <label for="search-input" class="block text-sm font-semibold text-slate-700 mb-1">
            Search Company Name
          </label>
          <div class="relative">
            <input
              type="text"
              id="search-input"
              placeholder="e.g. Acme, Globex, Initech..."
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 text-sm outline-none transition"
            />
          </div>
        </div>
        <div class="flex gap-2">
          <button
            id="search-button"
            class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition shadow-sm hover:shadow"
          >
            Search Invoices
          </button>
          <button
            id="reset-button"
            class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition"
          >
            Reset
          </button>
        </div>
      </div>
      <div id="search-status" class="mt-3 text-sm text-slate-500 font-medium"></div>
    </section>

    <!-- Invoices Table Section -->
    <section class="mt-8 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-900">Invoices</h2>
        <span id="results-count" class="text-xs text-slate-500 font-medium">Showing 6 invoices</span>
      </div>
      
      <div class="overflow-x-auto">
        <table id="invoices-table" class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
              <th class="py-3 px-6">Invoice ID</th>
              <th class="py-3 px-6">Company</th>
              <th class="py-3 px-6">Invoice Date</th>
              <th class="py-3 px-6">Amount</th>
              <th class="py-3 px-6">Due Date</th>
              <th class="py-3 px-6">Status</th>
            </tr>
          </thead>
          <tbody id="invoices-tbody" class="divide-y divide-slate-100 text-sm">
            <!-- Invoices rows injected here -->
          </tbody>
        </table>
      </div>
      
      <div id="no-results" class="hidden py-12 text-center text-slate-400">
        <p class="text-base font-medium">No invoices found matching your query.</p>
        <p class="text-xs text-slate-400 mt-1">Try searching for "Acme", "Globex", or "Initech".</p>
      </div>
    </section>
  </div>

  <script>
    const INITIAL_INVOICES = [
      { id: "INV-1024", company: "Acme", date: "2026-10-02", amount: "₹48,500", rawAmount: 48500, dueDate: "2026-10-15", status: "Unpaid" },
      { id: "INV-1018", company: "Acme", date: "2026-09-18", amount: "₹31,200", rawAmount: 31200, dueDate: "2026-10-01", status: "Paid" },
      { id: "INV-1002", company: "Acme", date: "2026-08-20", amount: "₹27,500", rawAmount: 27500, dueDate: "2026-09-05", status: "Paid" },
      { id: "INV-2041", company: "Globex", date: "2026-09-28", amount: "₹65,000", rawAmount: 65000, dueDate: "2026-10-12", status: "Unpaid" },
      { id: "INV-2010", company: "Globex", date: "2026-07-15", amount: "₹42,000", rawAmount: 42000, dueDate: "2026-08-01", status: "Paid" },
      { id: "INV-3088", company: "Initech", date: "2026-10-01", amount: "₹19,800", rawAmount: 19800, dueDate: "2026-10-20", status: "Unpaid" }
    ];

    document.getElementById("portal-timestamp").textContent = new Date().toLocaleDateString();

    const tbody = document.getElementById("invoices-tbody");
    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-button");
    const resetBtn = document.getElementById("reset-button");
    const searchStatus = document.getElementById("search-status");
    const resultsCount = document.getElementById("results-count");
    const noResults = document.getElementById("no-results");

    function renderInvoices(invoices) {
      tbody.innerHTML = "";
      if (invoices.length === 0) {
        noResults.classList.remove("hidden");
        resultsCount.textContent = "0 invoices found";
        return;
      }
      noResults.classList.add("hidden");
      resultsCount.textContent = `Showing ${invoices.length} invoice${invoices.length === 1 ? '' : 's'}`;

      invoices.forEach(inv => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50/80 transition invoice-row";
        tr.setAttribute("data-invoice-id", inv.id);
        tr.setAttribute("data-company", inv.company);
        tr.setAttribute("data-date", inv.date);
        tr.setAttribute("data-amount", inv.amount);
        tr.setAttribute("data-due-date", inv.dueDate);
        
        tr.innerHTML = `
          <td class="py-3.5 px-6 font-mono font-medium text-indigo-600 invoice-id">${inv.id}</td>
          <td class="py-3.5 px-6 font-medium text-slate-900 company-name">${inv.company}</td>
          <td class="py-3.5 px-6 text-slate-600 invoice-date">${inv.date}</td>
          <td class="py-3.5 px-6 font-semibold text-slate-900 invoice-amount">${inv.amount}</td>
          <td class="py-3.5 px-6 text-slate-600 invoice-due-date">${inv.dueDate}</td>
          <td class="py-3.5 px-6">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${
              inv.status === 'Paid' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'
            }">
              ${inv.status}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function performSearch() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        renderInvoices(INITIAL_INVOICES);
        searchStatus.textContent = "Displaying all available invoices.";
        return;
      }
      const filtered = INITIAL_INVOICES.filter(inv => 
        inv.company.toLowerCase().includes(q) || inv.id.toLowerCase().includes(q)
      );
      renderInvoices(filtered);
      searchStatus.textContent = `Found ${filtered.length} invoice(s) matching "${searchInput.value.trim()}".`;
    }

    searchBtn.addEventListener("click", performSearch);
    searchInput.addEventListener("keyup", (e) => {
      if (e.key === "Enter") performSearch();
    });

    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      renderInvoices(INITIAL_INVOICES);
      searchStatus.textContent = "Reset to all invoices.";
    });

    // Check URL query param e.g. ?search=Acme
    const urlParams = new URLSearchParams(window.location.search);
    const searchParam = urlParams.get("search") || urlParams.get("company");
    if (searchParam) {
      searchInput.value = searchParam;
      performSearch();
    } else {
      renderInvoices(INITIAL_INVOICES);
      searchStatus.textContent = "Displaying all available invoices.";
    }
  </script>
</body>
</html>
