services:
  - type: web
    name: centralign-ai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_SLOWMO_MS
        value: "300"
      - key: ENVIRONMENT
        value: production
      - key: EVIDENCE_DIR
        value: /tmp/evidence
      - key: MAX_RETRIES
        value: "2"
      - key: FRONTEND_URL
        sync: false
      - key: INVOICE_PORTAL_URL
        sync: false
      - key: BILLING_PORTAL_URL
        sync: false
